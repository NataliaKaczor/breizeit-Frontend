<section class="lebensmittelliste">
    <div class="lebensmittelContainer">
        <div class="lebensmittelKopfzeile">
            <h2>Lebensmittelliste</h2>
            <a routerLink="/lebensmittelform"> neues Lebensmittel eintragen</a>
        </div>
        <div class="lebensmittelListe">
            <div class="lebensmittelKarte" *ngFor="let lebensmittel of lebensmittel">
                <img class="lebensmittelBild" [src]="lebensmittel.bild" [alt]="lebensmittel.name">
                <div class="lebensmittelInhalt">
                    <h3>{{ lebensmittel.name }}</h3>
                    <div class="lebensmittelInfo">
                        <p>{{ lebensmittel.altersempfehlung }}</p>
                        <a routerLink="/lebensmittelansicht">Mehr erfahren</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
